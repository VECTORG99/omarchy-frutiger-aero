source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 4
    blur_size = 12
    noise = 0.01
    contrast = 0.85
    brightness = 0.75
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 400, 70
    position = 0, -80
    halign = center
    valign = center

    inner_color = rgba(90, 172, 160, 0.25)
    outer_color = rgba(18, 153, 202, 0)
    outline_thickness = 0

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter your password...
    check_color = $check_color
    fail_text = <span foreground="#C85A50"><i>$FAIL ($ATTEMPTS)</i></span>
    fail_color = rgba(200, 90, 80, 1.0)

    rounding = 16
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(18, 153, 202, 0.35)
    fade_on_empty = true
    dots_center = true
    dots_spacing = 0.5
    dots_size = 0.3
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d  •  %H:%M')"
    color = rgba(200, 228, 224, 0.9)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(26, 51, 68, 0.3)
}

label {
    text = Welcome back
    color = rgba(200, 228, 224, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

auth {
    fingerprint:enabled = false
}
